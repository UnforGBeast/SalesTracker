<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ BRAND_NAME }} | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {{ BRAND_TAILWIND_CONFIG|safe }};</script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex h-screen overflow-hidden">

    <!-- Mobile-only backdrop behind the open drawer -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-30 hidden" onclick="closeSidebar()"></div>

    <!-- 1. TailAdmin Sidebar Style -->
    <!-- Off-canvas drawer on mobile (toggled by the header's hamburger button);
         always visible in normal document flow from the sm breakpoint up. -->
    <aside id="sidebar" class="w-64 bg-{{ BRAND_COLOR }}-900 text-white flex flex-col fixed sm:static inset-y-0 left-0 z-40 transform -translate-x-full sm:translate-x-0 transition-transform duration-200 ease-in-out shadow-xl border-r border-{{ BRAND_COLOR }}-800">
        <div class="h-16 flex items-center justify-between px-6 border-b border-{{ BRAND_COLOR }}-800 font-bold text-xl tracking-wider">
            <span class="flex items-center gap-2 truncate">
                {% if BRAND_LOGO %}<img src="{{ BRAND_LOGO }}" alt="" class="h-6 w-6 object-contain flex-shrink-0">{% endif %}
                <span class="truncate">{{ BRAND_NAME }}</span>
            </span>
            <button class="sm:hidden text-{{ BRAND_COLOR }}-200 hover:text-white p-1" onclick="closeSidebar()" aria-label="Close menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <nav class="flex-1 py-4 flex flex-col gap-2 px-4">
            <!-- Dynamic Active States -->
            <a href="/dashboard/" onclick="closeSidebar()" class="flex items-center gap-3 px-4 py-2 rounded-md bg-{{ BRAND_COLOR }}-800 text-{{ BRAND_COLOR }}-50 hover:bg-{{ BRAND_COLOR }}-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <a href="/inventory/" onclick="closeSidebar()" class="flex items-center gap-3 px-4 py-2 rounded-md text-{{ BRAND_COLOR }}-200 hover:bg-{{ BRAND_COLOR }}-800 hover:text-white transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Inventory
            </a>
            <a href="/catalogue/" onclick="closeSidebar()" class="flex items-center gap-3 px-4 py-2 rounded-md text-{{ BRAND_COLOR }}-200 hover:bg-{{ BRAND_COLOR }}-800 hover:text-white transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bag" viewBox="0 0 16 16">
                <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>
            </svg> Live Catalogue
            </a>
            <a href="/scanner/" onclick="closeSidebar()" class="flex items-center gap-3 px-4 py-2 rounded-md text-{{ BRAND_COLOR }}-200 hover:bg-{{ BRAND_COLOR }}-800 hover:text-white transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 012-2h2M3 17v2a2 2 0 002 2h2m10-16h2a2 2 0 012 2v2m-4 12h2a2 2 0 002-2v-2M7 12h10"></path></svg>
                Scanner
            </a>
            <a href="/admin/" onclick="closeSidebar()" class="flex items-center gap-3 px-4 py-2 rounded-md text-{{ BRAND_COLOR }}-200 hover:bg-{{ BRAND_COLOR }}-800 hover:text-white transition">

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people" viewBox="0 0 16 16">
  <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/>
</svg> Admin Panel
            </a>
        </nav>
        <div class="px-4 py-4 border-t border-{{ BRAND_COLOR }}-800">
            <a href="/logout/" class="flex items-center gap-3 px-4 py-2 rounded-md text-{{ BRAND_COLOR }}-300 hover:bg-{{ BRAND_COLOR }}-800 hover:text-white transition text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log out
            </a>
        </div>
    </aside>

    <!-- 2. Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden relative">

        <!-- TailAdmin Top Header Style -->
        <header class="h-16 bg-white border-b border-slate-200 shadow-sm flex items-center justify-between px-6 z-10">
            <div class="flex items-center gap-4">
                <button class="sm:hidden text-slate-500 hover:text-{{ BRAND_COLOR }}-600" onclick="openSidebar()" aria-label="Open menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h2 class="text-xl font-semibold text-slate-800">{% block header_title %}Overview{% endblock %}</h2>
            </div>
        </header>

        <!-- Dynamic Page Content injects here -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script>
        function openSidebar() {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.remove('hidden');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }
        // A resize past the sm breakpoint (e.g. rotating a tablet) should never
        // leave the drawer's mobile-only backdrop stuck visible.
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 640) document.getElementById('sidebar-overlay').classList.add('hidden');
        });
    </script>
</body>
</html>
