<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="flex items-center gap-3">
    {% if BRAND_LOGO %}
        <img src="{{ BRAND_LOGO }}" alt="{{ BRAND_NAME }} Logo" class="h-8 w-auto object-contain">
    {% endif %}
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ BRAND_NAME }}</h1>
</div>
    <title>{{ BRAND_NAME }} Scanner Dashboard</title>
    <!-- HTML5 QR Code Scanner Library -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<!-- Subtle scanning beep sound -->
<audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-sm border-x border-slate-200">
        <div class="pt-8 pb-6 px-6 text-center border-b border-slate-100">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ BRAND_NAME }}</h1>
        </div>

        <!-- 3-Way Mode Selector -->
        <div class="flex border-b border-slate-200 text-center">
            <button id="btn-inbound" class="flex-1 py-4 text-xs font-semibold text-slate-900 border-b-2 border-slate-900" onclick="setMode('INBOUND')">INBOUND</button>
            <button id="btn-outbound" class="flex-1 py-4 text-xs font-medium text-slate-400 border-b-2 border-transparent" onclick="setMode('OUTBOUND')">DISPATCH</button>
            <button id="btn-return" class="flex-1 py-4 text-xs font-medium text-slate-400 border-b-2 border-transparent" onclick="setMode('RETURN')">RETURN</button>
        </div>

        <div class="p-6">
            <div id="reader" class="w-full bg-slate-900 rounded-xl overflow-hidden shadow-inner"></div>
            <p id="scan-status" class="text-center mt-4 text-sm font-medium text-slate-500">Waiting for scanner...</p>
        </div>
        <div id="return-fields" class="px-6 pb-4 hidden text-center">
            <select id="return_reason" class="w-full p-3.5 bg-white border border-slate-300 rounded-lg text-sm mb-2 shadow-sm font-medium text-slate-700">
                <option value="UNSOLD">Unsold / Stock Swap</option>
                <option value="DEFECTIVE">Defective / Damaged</option>
                <option value="CANCELED">Customer Canceled</option>
                <option value="WRONG_ITEM">Wrong Item Shipped</option>
                <option value="OTHER">Other</option>
            </select>
            <p class="text-sm text-slate-600 font-medium">Select a reason above, then scan the barcode to process.</p>
        </div>

        <div id="form-container" class="px-6 pb-8 hidden">
            <input type="hidden" id="scanned-qr">
            
            <div id="inbound-fields" class="space-y-3">
                <select id="product_type" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                    <option value="" disabled selected>Select Product Type</option>
                    <option value="SUIT">Suit</option>
                    <option value="SAREE">Saree</option>
                    <option value="GHARARA">Gharara</option>
                    <option value="DUPATTA">Dupatta</option>
                    <option value="FABRIC">Fabric</option>
                    <option value="SHARARA">Sharara</option>
                </select>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 font-medium">₹</span>
                    <input type="number" id="price" placeholder="Selling Price" step="0.01" class="w-full p-3.5 pl-8 bg-slate-50 border rounded-lg text-sm">
                </div>
                <input type="text" id="design_work" placeholder="Design Work" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                <input type="text" id="weaver_name" placeholder="Weaver Name" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                
                <label class="block text-sm font-medium text-slate-700 mt-2">Product Image (Optional)</label>
                <input type="file" id="product_image" accept="image/*" capture="environment" class="w-full p-2 bg-slate-50 border rounded-lg text-sm text-slate-500">
            </div>

            <div id="outbound-fields" class="space-y-3 hidden">
                <input type="number" id="pincode" placeholder="6-Digit Pincode" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                <select id="sales_channel" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                    <option value="" disabled selected>Select Sales Channel</option>
                    <option value="RETAIL">Retail Shop</option>
                    <option value="WHOLESALE">Wholesale B2B</option>
                    <option value="ONLINE">Online E-commerce</option>
                </select>
            </div>
            <!-- Bulk Mode Controls -->
            <div id="bulk-mode-container" class="flex items-center gap-2 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
    <input type="checkbox" id="bulkMode" class="w-5 h-5 text-slate-800 border-slate-300 rounded focus:ring-slate-800 cursor-pointer">
    <label for="bulkMode" class="text-sm font-semibold text-slate-700 cursor-pointer">
        Bulk Scan Mode <span class="font-normal text-slate-500">(Retain product details & image)</span>
    </label>
</div>
            </div>
                <!-- Hidden field to hold the image path -->
                <input type="hidden" id="reusedImagePath" name="reused_image_path" value="">

               <button id="submit-btn" onclick="submitData()" class="w-full bg-slate-900 text-white font-medium text-sm py-4 rounded-lg mt-6 shadow-sm">
                Save Record
            </button>
        </div>
    </div>

    <script>
        let currentMode = 'INBOUND';
        let html5QrCode;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('inbound-fields').classList.toggle('hidden', mode !== 'INBOUND');
            document.getElementById('outbound-fields').classList.toggle('hidden', mode !== 'OUTBOUND');
            document.getElementById('return-fields').classList.toggle('hidden', mode !== 'RETURN');
            
            // NEW: Hide the Bulk toggle if not on INBOUND
            document.getElementById('bulk-mode-container').classList.toggle('hidden', mode !== 'INBOUND');
            // Hide submit button entirely during return mode since it auto-submits
            document.getElementById('submit-btn').classList.toggle('hidden', mode === 'RETURN');
            
            document.getElementById('btn-inbound').className = mode === 'INBOUND' ? "flex-1 py-4 text-xs font-semibold text-slate-900 border-b-2 border-slate-900" : "flex-1 py-4 text-xs font-medium text-slate-400 border-b-2 border-transparent";
            document.getElementById('btn-outbound').className = mode === 'OUTBOUND' ? "flex-1 py-4 text-xs font-semibold text-slate-900 border-b-2 border-slate-900" : "flex-1 py-4 text-xs font-medium text-slate-400 border-b-2 border-transparent";
            document.getElementById('btn-return').className = mode === 'RETURN' ? "flex-1 py-4 text-xs font-semibold text-slate-900 border-b-2 border-slate-900" : "flex-1 py-4 text-xs font-medium text-slate-400 border-b-2 border-transparent";
            
            resetScanner();
        }

 function onScanSuccess(decodedText) {
    document.getElementById('scanned-qr').value = decodedText;
    
    // Always pause the camera immediately upon reading a code
    if (html5QrCode) {
        html5QrCode.pause(true);
    }

    const isBulkMode = document.getElementById('bulkMode') ? document.getElementById('bulkMode').checked : false;
    const hasReusedImage = document.getElementById('reusedImagePath').value !== "";

    if (currentMode === 'RETURN') {
        document.getElementById('scan-status').innerText = "Processing Return...";
        document.getElementById('scan-status').className = "text-center mt-4 text-sm font-semibold text-blue-600";
        submitData();
    } 
    else if (currentMode === 'INBOUND' && isBulkMode && hasReusedImage) {
        // ACTIVE BULK LOOP: Auto-submit without waiting for the button tap!
        document.getElementById('scan-status').innerText = `Logging Bulk Item: ${decodedText}...`;
        document.getElementById('scan-status').className = "text-center mt-4 text-sm font-semibold text-blue-600";
        submitData();
    } 
    else {
        // NORMAL INBOUND (First item in the batch)
        document.getElementById('scan-status').innerText = "✓ QR Scanned Successfully";
        document.getElementById('scan-status').className = "text-center mt-4 text-sm font-semibold text-emerald-600";
        document.getElementById('form-container').classList.remove('hidden');
    }
}

function resetScanner() {
    document.getElementById('form-container').classList.add('hidden');
    document.getElementById('scan-status').innerText = "Waiting for scanner...";
    document.getElementById('scan-status').className = "text-center mt-4 text-sm font-medium text-slate-500";
    
    // Clear bulk mode locks
    document.getElementById('reusedImagePath').value = '';
    document.getElementById('product_image').disabled = false;
    document.getElementById('bulkMode').checked = false;
    
    if (html5QrCode) {
        try {
            if (html5QrCode.getState() === 3) html5QrCode.resume();
        } catch (e) {
            startCamera();
        }
    }
}

async function submitData() {
    let endpoint = '';
    let formData = new FormData();
    let reusedPath = ''; // FIX: Declared at the top so the whole function can see it
    
    const qrValue = document.getElementById('scanned-qr').value;
    if (!qrValue) {
        alert("No QR code detected!");
        resetScanner();
        return;
    }
    
    formData.append('qr_id', qrValue);
    
    const isBulkMode = document.getElementById('bulkMode') ? document.getElementById('bulkMode').checked : false;

    // Route matching your urls.py exactly
    if (currentMode === 'INBOUND') {
        endpoint = '/api/inbound/'; 
        formData.append('product_type', document.getElementById('product_type').value);
        formData.append('design_work', document.getElementById('design_work').value);
        formData.append('price', document.getElementById('price').value);
        formData.append('weaver_name', document.getElementById('weaver_name').value);
        
        reusedPath = document.getElementById('reusedImagePath').value;
        if (reusedPath) {
            formData.append('reused_image_path', reusedPath);
        } else {
            const imageFile = document.getElementById('product_image').files[0];
            if (imageFile) formData.append('product_image', imageFile);
        }
    } else if (currentMode === 'OUTBOUND') {
        endpoint = '/api/outbound/';
        formData.append('pincode', document.getElementById('pincode').value);
        formData.append('sales_channel', document.getElementById('sales_channel').value);
    } else {
        endpoint = '/api/return/';
        formData.append('return_reason', document.getElementById('return_reason').value);
    }

    try {
        let response = await fetch(endpoint, {
            method: 'POST',
            body: formData
        });
        
        // UNMASK THE ERROR: Check if Django threw an HTML crash page (500 or 404)
        const contentType = response.headers.get("content-type");
        if (contentType && contentType.indexOf("application/json") === -1) {
            console.error("Server crashed and returned HTML instead of JSON.");
            alert(`Server Error (Status ${response.status}). Check Gunicorn logs!`);
            resetScanner();
            return;
        }

        let result = await response.json();
        
        if (response.ok) {
            document.getElementById('beepSound').play().catch(()=>{});

            if (currentMode === 'INBOUND' && isBulkMode) {
                const statusEl = document.getElementById('scan-status');
                statusEl.innerText = "✓ " + result.message;
                statusEl.className = "text-center mt-4 text-sm font-semibold text-emerald-600";
                
                document.getElementById('reusedImagePath').value = result.saved_image_path || reusedPath;
                document.getElementById('scanned-qr').value = '';
                document.getElementById('product_image').disabled = true; 
                
                if (html5QrCode && html5QrCode.getState() === 3) html5QrCode.resume();
            } else {
                alert(result.message);
                resetScanner();
            }
        } else {
            // SERVER REJECTED SCAN (e.g., Duplicate item)
            alert("Notice: " + (result.error || result.detail || "Server Rejected Scan"));
            
            if (currentMode === 'INBOUND' && isBulkMode) {
                // BULK OVERRIDE: Show red warning, clear the bad QR, and immediately resume camera
                const statusEl = document.getElementById('scan-status');
                statusEl.innerText = "⚠ Skipped: " + (result.error || "Item rejected");
                statusEl.className = "text-center mt-4 text-sm font-semibold text-rose-600";
                
                document.getElementById('scanned-qr').value = '';
                if (html5QrCode && html5QrCode.getState() === 3) html5QrCode.resume();
            } else {
                // NORMAL MODE: Full reset
                resetScanner();
            }
        }
    } catch (error) {
        console.error("Fatal JS Error: ", error);
        alert("Fatal Error. Check console logs.");
        resetScanner();
    }
}


       
        function startCamera() {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                document.getElementById('scan-status').innerText = "Camera denied.";
                document.getElementById('scan-status').className = "text-center mt-4 text-sm font-medium text-red-500";
            });
        }
        window.onload = startCamera;
    </script>
   
</body>
</html>
