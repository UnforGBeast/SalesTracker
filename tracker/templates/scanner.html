<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="{{ BRAND_ACCENT_HEX }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{ BRAND_NAME }}">
    <link rel="manifest" href="{% url 'pwa_manifest' %}">
    <link rel="apple-touch-icon" href="{{ BRAND_LOGO }}">
    <title>{{ BRAND_NAME }} Scanner</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {{ BRAND_TAILWIND_CONFIG|safe }};</script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Subtle scanning beep sound -->
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-sm border-x border-slate-200">

        <div class="pt-8 pb-6 px-6 flex items-center justify-between border-b border-slate-100">
            <div class="flex items-center gap-3">
                {% if BRAND_LOGO %}
                    <img src="{{ BRAND_LOGO }}" alt="{{ BRAND_NAME }} Logo" class="h-8 w-auto object-contain">
                {% endif %}
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ BRAND_NAME }}</h1>
            </div>
            <a href="{% url 'scanner_logout' %}" class="text-xs font-medium text-slate-400 hover:text-slate-600">Log out</a>
        </div>

        <!-- 4-Way Mode Selector -->
        <div class="flex border-b border-slate-200 text-center">
            <button id="btn-inbound" class="flex-1 py-4 text-xs font-semibold border-b-2" onclick="setMode('INBOUND')">INBOUND</button>
            <button id="btn-outbound" class="flex-1 py-4 text-xs font-medium border-b-2" onclick="setMode('OUTBOUND')">DISPATCH</button>
            <button id="btn-return" class="flex-1 py-4 text-xs font-medium border-b-2" onclick="setMode('RETURN')">RETURN</button>
            <button id="btn-lookup" class="flex-1 py-4 text-xs font-medium border-b-2" onclick="setMode('LOOKUP')">LOOKUP</button>
        </div>

        <div class="p-6">
            <div id="reader" class="w-full bg-slate-900 rounded-xl overflow-hidden shadow-inner"></div>
            <p id="scan-status" class="text-center mt-4 text-sm font-medium text-slate-500">Starting camera&hellip;</p>
        </div>

        <div id="return-fields" class="px-6 pb-4 hidden text-center">
            <select id="return_reason" class="w-full p-3.5 bg-white border border-slate-300 rounded-lg text-sm mb-2 shadow-sm font-medium text-slate-700">
                <option value="UNSOLD">Unsold / Stock Swap</option>
                <option value="DEFECTIVE">Defective / Damaged</option>
                <option value="CANCELED">Customer Canceled</option>
                <option value="WRONG_ITEM">Wrong Item Shipped</option>
                <option value="OTHER">Other</option>
            </select>
            <p class="text-sm text-slate-600 font-medium">Select a reason above, then scan the barcode to process.</p>
        </div>

        <!-- LOOKUP mode: read-only result card, no form/submit involved -->
        <div id="lookup-result" class="px-6 pb-6 hidden">
            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50">
                <div class="flex gap-4">
                    <div id="lookup-image-wrap" class="w-16 h-16 rounded-lg bg-slate-200 flex-shrink-0 overflow-hidden hidden">
                        <img id="lookup-image" class="w-full h-full object-cover" alt="">
                    </div>
                    <div class="min-w-0 flex-1">
                        <p id="lookup-title" class="text-sm font-bold text-slate-900 uppercase truncate">—</p>
                        <p id="lookup-id" class="text-xs text-slate-500 font-mono mt-0.5">—</p>
                        <span id="lookup-status-badge" class="inline-flex items-center mt-2 px-2 py-0.5 rounded-full text-xs font-bold"></span>
                    </div>
                </div>
                <dl id="lookup-details" class="mt-4 grid grid-cols-2 gap-x-4 gap-y-2 text-sm"></dl>
            </div>
        </div>

        <div id="form-container" class="px-6 pb-8 hidden">
            <input type="hidden" id="scanned-qr">

            <div id="inbound-fields" class="space-y-3">
                <select id="product_type" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                    <option value="" disabled selected>Select Product Type</option>
                    <option value="SUIT">Suit</option>
                    <option value="SAREE">Saree</option>
                    <option value="GHARARA">Gharara</option>
                    <option value="DUPATTA">Dupatta</option>
                    <option value="FABRIC">Fabric</option>
                    <option value="SHARARA">Sharara</option>
                </select>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 font-medium">{{ CURRENCY_SYMBOL }}</span>
                    <input type="number" id="price" placeholder="Selling Price" step="0.01" class="w-full p-3.5 pl-8 bg-slate-50 border rounded-lg text-sm">
                </div>
                <input type="text" id="design_work" placeholder="Design Work" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                <input type="text" id="weaver_name" placeholder="Weaver Name" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">

                <label class="block text-sm font-medium text-slate-700 mt-2">Product Image (Optional)</label>
                <input type="file" id="product_image" accept="image/*" capture="environment" class="w-full p-2 bg-slate-50 border rounded-lg text-sm text-slate-500">
            </div>

            <div id="outbound-fields" class="space-y-3 hidden">
                <input type="number" id="pincode" placeholder="6-Digit Pincode" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                <select id="sales_channel" class="w-full p-3.5 bg-slate-50 border rounded-lg text-sm">
                    <option value="" disabled selected>Select Sales Channel</option>
                    <option value="RETAIL">Retail Shop</option>
                    <option value="WHOLESALE">Wholesale B2B</option>
                    <option value="ONLINE">Online E-commerce</option>
                </select>
            </div>

            <!-- Bulk Mode Controls -->
            <div id="bulk-mode-container" class="flex items-center gap-2 mb-6 mt-4 p-4 bg-slate-50 rounded-xl border border-slate-200">
                <input type="checkbox" id="bulkMode" class="w-5 h-5 text-brand-700 border-slate-300 rounded focus:ring-brand-700 cursor-pointer">
                <label for="bulkMode" class="text-sm font-semibold text-slate-700 cursor-pointer">
                    Bulk Scan Mode <span class="font-normal text-slate-500">(Retain product details &amp; image)</span>
                </label>
            </div>

            <!-- Hidden field to hold the reused image path across bulk scans -->
            <input type="hidden" id="reusedImagePath" name="reused_image_path" value="">

            <button id="submit-btn" onclick="submitData()" class="w-full bg-brand-700 text-white font-medium text-sm py-4 rounded-lg mt-2 shadow-sm active:bg-brand-800 disabled:opacity-50">
                Save Record
            </button>
        </div>
    </div>

    <script>
        /*
         * Scanner lifecycle state machine
         * --------------------------------
         * SCANNING    camera live, a scan will be accepted
         * LOCKED      a code has been read; waiting for the user to tap Save (or,
         *             in LOOKUP mode, waiting for the lookup request to finish)
         * SUBMITTING  a request is in flight
         * RESTARTING  camera is being torn down / brought back up
         *
         * Every completed transaction (success OR handled rejection) ends by calling
         * resumeScanner(), which un-pauses the live stream (instant) and only falls
         * back to a full restartScanner() teardown if the camera is actually broken.
         * No code path leaves the camera frozen, so scanning continues without a refresh.
         */
        let scannerState = 'RESTARTING';
        let currentMode = 'INBOUND';
        let html5QrCode = null;

        const $ = (id) => document.getElementById(id);
        const STATE_PAUSED = (window.Html5QrcodeScannerState && Html5QrcodeScannerState.PAUSED) || 3;
        const STATE_LIVE = (window.Html5QrcodeScannerState && Html5QrcodeScannerState.SCANNING) || 2;
        const INITIAL_MODE = '{{ initial_mode|default:"INBOUND" }}';
        const VALID_MODES = ['INBOUND', 'OUTBOUND', 'RETURN', 'LOOKUP'];

        function setStatus(msg, tone) {
            const tones = {
                idle: 'text-slate-500 font-medium',
                good: 'text-emerald-600 font-semibold',
                busy: 'text-blue-600 font-semibold',
                bad: 'text-rose-600 font-semibold',
                error: 'text-red-500 font-medium',
            };
            const el = $('scan-status');
            el.innerText = msg;
            el.className = 'text-center mt-4 text-sm ' + (tones[tone] || tones.idle);
        }

        function setMode(mode) {
            currentMode = mode;
            $('inbound-fields').classList.toggle('hidden', mode !== 'INBOUND');
            $('outbound-fields').classList.toggle('hidden', mode !== 'OUTBOUND');
            $('return-fields').classList.toggle('hidden', mode !== 'RETURN');
            $('bulk-mode-container').classList.toggle('hidden', mode !== 'INBOUND');
            $('form-container').classList.add('hidden');
            $('lookup-result').classList.add('hidden');
            $('submit-btn').classList.toggle('hidden', mode === 'RETURN' || mode === 'LOOKUP');

            const on = 'flex-1 py-4 text-xs font-semibold border-b-2 border-brand-700 text-brand-700';
            const off = 'flex-1 py-4 text-xs font-medium border-b-2 border-transparent text-slate-400';
            $('btn-inbound').className = mode === 'INBOUND' ? on : off;
            $('btn-outbound').className = mode === 'OUTBOUND' ? on : off;
            $('btn-return').className = mode === 'RETURN' ? on : off;
            $('btn-lookup').className = mode === 'LOOKUP' ? on : off;

            fullReset();
            resumeScanner();
        }

        // Return the form to a pristine "ready to scan the next item" state.
        function fullReset() {
            $('form-container').classList.add('hidden');
            $('scanned-qr').value = '';
            $('reusedImagePath').value = '';
            $('product_image').disabled = false;
            $('bulkMode').checked = false;
            $('submit-btn').disabled = false;
        }

        // ---- Camera control ----------------------------------------------------

        async function startCamera() {
            if (!html5QrCode) html5QrCode = new Html5Qrcode('reader');
            try {
                await html5QrCode.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    () => {}                 // per-frame decode miss: ignore quietly
                );
                scannerState = 'SCANNING';
                setStatus('Ready — point the camera at a QR code', 'idle');
                console.debug('[scanner] camera started');
            } catch (err) {
                scannerState = 'RESTARTING';
                setStatus('Camera unavailable. Check permissions, then reload.', 'error');
                console.error('[scanner] camera start failed', err);
            }
        }

        async function stopCamera() {
            if (!html5QrCode) return;
            try {
                await html5QrCode.stop();
            } catch (e) {
                console.debug('[scanner] stop ignored:', e && e.message);
            }
        }

        // Cold start / recovery only: full teardown + fresh start. Avoid on the
        // normal scan->save->scan loop -- stop() resolves before the camera track
        // is actually released, so an immediate start() can grab a half-released
        // camera and show a frozen frame.
        async function restartScanner() {
            scannerState = 'RESTARTING';
            setStatus('Resetting camera…', 'busy');
            await stopCamera();
            await startCamera();
        }

        // The one call every post-scan path uses. Handles all three cases:
        //   - camera already live  -> nothing to do
        //   - camera paused        -> resume() (instant, this is the happy path)
        //   - no camera / broken   -> fall back to a full restart
        async function resumeScanner() {
            try {
                const st = html5QrCode ? html5QrCode.getState() : null;
                if (st === STATE_LIVE) {
                    scannerState = 'SCANNING';
                    return;
                }
                if (st === STATE_PAUSED) {
                    html5QrCode.resume();
                    scannerState = 'SCANNING';
                    console.debug('[scanner] resumed');
                    return;
                }
            } catch (e) {
                console.debug('[scanner] resume failed, restarting:', e && e.message);
            }
            await restartScanner();
        }

        function pauseScanner() {
            try {
                if (html5QrCode && html5QrCode.getState() === STATE_LIVE) html5QrCode.pause(true);
            } catch (e) {
                console.debug('[scanner] pause ignored:', e && e.message);
            }
        }

        // ---- Scan handling ---------------------------------------------------

        function onScanSuccess(decodedText) {
            // Re-entry guard: the decode callback fires ~10x/sec. Only the first
            // hit while SCANNING counts; the rest are dropped until we are ready again.
            if (scannerState !== 'SCANNING') return;

            scannerState = 'LOCKED';
            pauseScanner();
            $('scanned-qr').value = decodedText;

            const isBulk = $('bulkMode').checked;
            const hasReusedImage = $('reusedImagePath').value !== '';

            if (currentMode === 'LOOKUP') {
                setStatus('Looking up ' + decodedText + ' …', 'busy');
                performLookup(decodedText);
            } else if (currentMode === 'RETURN') {
                setStatus('Processing return…', 'busy');
                submitData();
            } else if (currentMode === 'INBOUND' && isBulk && hasReusedImage) {
                setStatus('Logging bulk item: ' + decodedText + ' …', 'busy');
                submitData();
            } else {
                setStatus('✓ QR scanned — fill in the details and tap Save', 'good');
                $('form-container').classList.remove('hidden');
                // stay LOCKED until the user taps Save
            }
        }

        // ---- LOOKUP mode: read-only, no submit involved ------------------------

        function renderLookupRow(dl, label, value) {
            if (!value) return;
            const dt = document.createElement('dt');
            dt.className = 'text-slate-400 font-medium';
            dt.innerText = label;
            const dd = document.createElement('dd');
            dd.className = 'text-slate-700 text-right';
            dd.innerText = value;
            dl.appendChild(dt);
            dl.appendChild(dd);
        }

        const STATUS_BADGE_CLASSES = {
            IN_STOCK: 'bg-emerald-100 text-emerald-800',
            DISPATCHED: 'bg-brand-100 text-brand-800',
            RETURNED: 'bg-rose-100 text-rose-800',
        };

        async function performLookup(qrId) {
            scannerState = 'SUBMITTING';
            try {
                const response = await fetch('/api/lookup/?qr_id=' + encodeURIComponent(qrId));
                const result = await response.json().catch(() => ({}));

                $('lookup-result').classList.remove('hidden');
                const dl = $('lookup-details');
                dl.innerHTML = '';

                if (response.ok) {
                    $('lookup-title').innerText = result.product_type + (result.is_dead_stock ? ' · DEAD STOCK' : '');
                    $('lookup-id').innerText = '#' + result.id;
                    const badge = $('lookup-status-badge');
                    badge.innerText = result.status_display;
                    badge.className = 'inline-flex items-center mt-2 px-2 py-0.5 rounded-full text-xs font-bold ' +
                        (STATUS_BADGE_CLASSES[result.status] || 'bg-slate-200 text-slate-700');

                    if (result.image_url) {
                        $('lookup-image').src = result.image_url;
                        $('lookup-image-wrap').classList.remove('hidden');
                    } else {
                        $('lookup-image-wrap').classList.add('hidden');
                    }

                    renderLookupRow(dl, 'Price', '{{ CURRENCY_SYMBOL }}' + result.price);
                    renderLookupRow(dl, 'Weaver', result.weaver_name);
                    renderLookupRow(dl, 'Design', result.design_work);
                    renderLookupRow(dl, 'Entered', result.date_entered);
                    renderLookupRow(dl, 'Dispatched', result.date_dispatched);
                    renderLookupRow(dl, 'Channel', result.sales_channel);
                    renderLookupRow(dl, 'Destination', [result.derived_city, result.derived_state].filter(Boolean).join(', '));
                    renderLookupRow(dl, 'Return reason', result.return_reason);

                    setStatus('✓ Showing details for ' + result.id, 'good');
                } else {
                    $('lookup-title').innerText = 'Not found';
                    $('lookup-id').innerText = '#' + qrId;
                    $('lookup-image-wrap').classList.add('hidden');
                    const badge = $('lookup-status-badge');
                    badge.innerText = 'NO RECORD';
                    badge.className = 'inline-flex items-center mt-2 px-2 py-0.5 rounded-full text-xs font-bold bg-slate-200 text-slate-600';
                    setStatus('⚠ ' + (result.error || 'No product found for this QR code'), 'bad');
                }
            } catch (error) {
                console.error('[scanner] lookup failed', error);
                setStatus('Network error during lookup', 'bad');
            } finally {
                $('scanned-qr').value = '';
                await resumeScanner();
            }
        }

        async function submitData() {
            if (scannerState === 'SUBMITTING') return;     // guard double-tap / double-fire

            const qrValue = $('scanned-qr').value;
            if (!qrValue) {
                setStatus('No QR code detected — scan again', 'bad');
                await resumeScanner();
                return;
            }

            const isBulk = currentMode === 'INBOUND' && $('bulkMode').checked;
            scannerState = 'SUBMITTING';
            $('submit-btn').disabled = true;

            const formData = new FormData();
            formData.append('qr_id', qrValue);
            let reusedPath = '';

            if (currentMode === 'INBOUND') {
                formData.append('product_type', $('product_type').value);
                formData.append('design_work', $('design_work').value);
                formData.append('price', $('price').value);
                formData.append('weaver_name', $('weaver_name').value);

                reusedPath = $('reusedImagePath').value;
                if (reusedPath) {
                    formData.append('reused_image_path', reusedPath);
                } else {
                    const imageFile = $('product_image').files[0];
                    if (imageFile) formData.append('product_image', imageFile);
                }
            } else if (currentMode === 'OUTBOUND') {
                formData.append('pincode', $('pincode').value);
                formData.append('sales_channel', $('sales_channel').value);
            } else {
                formData.append('return_reason', $('return_reason').value);
            }

            const endpoint = currentMode === 'INBOUND' ? '/api/inbound/'
                : currentMode === 'OUTBOUND' ? '/api/outbound/'
                : '/api/return/';

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });

                // Unmask a Django HTML error page (500/404) instead of choking on JSON.parse.
                const contentType = response.headers.get('content-type') || '';
                if (contentType.indexOf('application/json') === -1) {
                    console.error('[scanner] non-JSON response, status', response.status);
                    alert('Server error (status ' + response.status + '). Check the server logs.');
                    fullReset();
                    await resumeScanner();
                    return;
                }

                const result = await response.json();

                if (response.ok) {
                    $('beepSound').play().catch(() => {});

                    if (isBulk) {
                        setStatus('✓ ' + result.message, 'good');
                        $('reusedImagePath').value = result.saved_image_path || reusedPath;
                        $('scanned-qr').value = '';
                        $('product_image').disabled = true;
                        $('submit-btn').disabled = false;
                        await resumeScanner();           // fast continuous loop
                    } else {
                        alert(result.message);
                        fullReset();
                        await resumeScanner();          // un-pause; this is the normal loop
                    }
                } else {
                    const msg = result.error || result.detail || 'Server rejected the scan';
                    if (isBulk) {
                        setStatus('⚠ Skipped: ' + msg, 'bad');
                        $('scanned-qr').value = '';
                        $('submit-btn').disabled = false;
                        await resumeScanner();
                    } else {
                        alert('Notice: ' + msg);
                        fullReset();
                        await resumeScanner();
                    }
                }
            } catch (error) {
                console.error('[scanner] fatal error', error);
                alert('Network error. Check your connection and try again.');
                fullReset();
                await resumeScanner();
            }
        }

        window.addEventListener('load', () => {
            setMode(VALID_MODES.includes(INITIAL_MODE) ? INITIAL_MODE : 'INBOUND');

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.debug('[scanner] service worker registration failed:', err && err.message);
                });
            }
        });
    </script>
</body>
</html>
