<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ BRAND_NAME }} Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {{ BRAND_TAILWIND_CONFIG|safe }};</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            {% if BRAND_LOGO %}<img src="{{ BRAND_LOGO }}" alt="{{ BRAND_NAME }}" class="h-10 w-10 mx-auto mb-3 object-contain">{% endif %}
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ BRAND_NAME }}</h1>
            <p class="text-sm text-slate-500 mt-1">Warehouse staff login</p>
        </div>

        <form method="POST" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-4">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg px-4 py-3">
                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autofocus required autocapitalize="none" autocomplete="username"
                       class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required autocomplete="current-password"
                       class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-3.5 rounded-lg shadow-sm transition-colors">
                Log in
            </button>
        </form>
    </div>
</body>
</html>
